name: build
on:
  push:
    # uploading the zip alone must not build (that commit still holds the old code): Claude Code's push builds
    paths-ignore: ["MoneyMakingMachine*.zip", "**/MoneyMakingMachine*.zip"]
  workflow_dispatch:
permissions:
  contents: write
env:
  PYI: >-
    pyinstaller --noconfirm --windowed --name MoneyMakingMachine --collect-all imageio_ffmpeg --collect-all onnxruntime --collect-all tokenizers --collect-data certifi --collect-all cv2 --collect-all faster_whisper --collect-all ctranslate2 --collect-all av
    --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick
    --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtMultimedia
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, name: "Apple-Silicon-M1-M2-M3-M4", mlx: true }
          - { runner: macos-15-intel, name: "Mac-Intel", mlx: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller pillow
      - name: Fast speech engine on the graphics chip (Apple Silicon only; if it fails the app keeps faster-whisper)
        if: ${{ matrix.mlx }}
        continue-on-error: true
        run: |
          # mlx-whisper WITHOUT torch (only its model converter needs torch); numba + scipy are for word timings
          # mlx-metal holds libmlx.dylib: without it "import mlx.core" fails and the app silently used the processor
          pip install mlx mlx-metal mlx-whisper --no-deps
          pip install numba scipy tiktoken more-itertools
          python -c "import mlx.core, mlx_whisper, mlx_whisper.timing, numba, scipy; print('mlx ok')"
          echo "MLX_FLAGS=--collect-all mlx --collect-all mlx_whisper --collect-all tiktoken --hidden-import tiktoken_ext.openai_public --collect-all llvmlite --collect-submodules numba" >> "$GITHUB_ENV"
      - name: Story XML structure test (stops the build if it differs from the reference)
        env: { PYTHONIOENCODING: utf-8 }
        run: |
          python tools/story_check.py
          python tools/speakers_check.py
          python tools/transcribe_check.py
          python tools/daymap_check.py
      - run: python make_icons.py
      - run: ${{ env.PYI }} $MLX_FLAGS --exclude-module torch --icon icon.icns --add-data "icon.png:." --add-data "assets:assets" --osx-bundle-identifier com.moneymakingmachine.app app.py
      - name: Check bundled FFmpeg and ad-hoc sign
        run: |
          find dist/MoneyMakingMachine.app -name 'ffmpeg*' -type f
          chmod +x dist/MoneyMakingMachine.app/Contents/Resources/imageio_ffmpeg/binaries/ffmpeg* || true
          codesign --force --deep -s - dist/MoneyMakingMachine.app
      - name: Create DMG
        run: |
          mkdir stage && cp -R dist/MoneyMakingMachine.app stage/ && ln -s /Applications stage/Applications
          hdiutil create -volname MoneyMakingMachine -srcfolder stage -ov -format UDZO MoneyMakingMachine-${{ matrix.name }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MoneyMakingMachine-${{ matrix.name }}
          path: MoneyMakingMachine-${{ matrix.name }}.dmg
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller pillow
      - name: Story XML structure test (stops the build if it differs from the reference)
        env: { PYTHONIOENCODING: utf-8 }
        run: |
          python tools/story_check.py
          python tools/speakers_check.py
          python tools/transcribe_check.py
          python tools/daymap_check.py
      - run: python make_icons.py
      - run: ${{ env.PYI }} --icon icon.ico --add-data "icon.png;." --add-data "assets;assets" app.py
      - uses: actions/upload-artifact@v4
        with: { name: MoneyMakingMachine-Windows, path: dist/MoneyMakingMachine }
  release:
    # every build on main is published as a GitHub Release named after the app version (VER in app.py),
    # so the app's "Check for updates" finds it and the DMG can be downloaded without logging in
    if: github.ref == 'refs/heads/main'
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: v
        run: echo "ver=$(python3 -c "import re;print(re.search(r'\"(v\d+\.\d+\.\d+)\"',open('app.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Pack the Windows folder
        run: cd dist && zip -qr MoneyMakingMachine-Windows.zip MoneyMakingMachine-Windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.ver }}
          name: MoneyMakingMachine ${{ steps.v.outputs.ver }}
          make_latest: true
          files: |
            dist/**/*.dmg
            dist/MoneyMakingMachine-Windows.zip
